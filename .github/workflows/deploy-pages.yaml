name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save docs to temp
        run: |
          cp -r docs /tmp/docs-backup

      - name: Checkout gh-pages
        run: |
          git checkout --orphan gh-pages || git checkout gh-pages
          git reset --hard
          git clean -fdx

      - name: Copy docs
        run: |
          cp -r /tmp/docs-backup/* .
          rm -rf .github Makefile cmd internal go.mod go.sum VERSION LICENSE .gitignore

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy pages from ${{ github.sha }}" || echo "No changes to commit"
          git push origin gh-pages --force
